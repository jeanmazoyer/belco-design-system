<title>Orica pour les designers</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&display=swap">
<style>
/* Layout: same Geist-style shell as the Belco public doc (left nav in three groups, sticky search bar, one reading column
   with preview cards, "Afficher le code" and "IA Rules"), skinned with the Belco Hub / Orica tokens relevé in the app. Single light theme. */
:root{
  /* palette relevée sur hub.belco-sandbox.synako.fr (module Orica) */
  --color-white:#FFFFFF;
  --color-grey-50:#F8F9FA;
  --color-grey-100:#EDF0F4;
  --color-grey-150:#E5E9EF;
  --color-grey-200:#D8DEE7;
  --color-grey-300:#C5CAD2;
  --color-grey-500:#999EA4;
  --color-grey-600:#777A7F;
  --color-grey-700:#4F5459;
  --color-grey-900:#232930;
  --color-green-50:#E7F1ED;
  --color-green-100:#BCE6CE;
  --color-green-600:#127746;
  --color-green-700:#156035;
  --color-green-800:#0D5432;
  --color-blue-100:#BEE3F8;
  --color-blue-800:#2A4365;
  --color-yellow-100:#FFF8DB;
  --color-yellow-800:#806600;
  --color-red-500:#FF0000;
  --color-sand-200:#F0DBB4;
  --color-clay-200:#DCBFAD;
  --color-gold-400:#DEAF58;
  --color-brown-500:#B17149;
  /* rôles */
  --color-background:var(--color-grey-50);
  --color-surface:var(--color-grey-100);
  --color-surface-strong:var(--color-grey-150);
  --color-text:var(--color-grey-900);
  --color-text-muted:var(--color-grey-600);
  --color-text-faint:var(--color-grey-500);
  --color-border:var(--color-grey-200);
  --color-border-light:var(--color-grey-100);
  --color-primary:var(--color-green-600);
  --color-primary-foreground:var(--color-white);
  --color-primary-soft:var(--color-green-50);
  --color-success-soft:var(--color-green-100);
  --color-success-text:var(--color-green-700);
  --color-info-soft:var(--color-blue-100);
  --color-info-text:var(--color-blue-800);
  --color-warning-soft:var(--color-yellow-100);
  --color-warning-text:var(--color-yellow-800);
  --color-danger:var(--color-red-500);
  /* typographie : une seule famille */
  --font-sans:"Centra No2","CentraNo2","Outfit",system-ui,sans-serif;
  --font-mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  --font-weight-book:400; --font-weight-medium:500; --font-weight-semibold:600; --font-weight-bold:700;
  --text-2xs:10px; --text-xs:12px; --text-sm:13px; --text-base:14px; --text-lg:16px; --text-xl:20px; --text-2xl:25px;
  --leading-2xs:14px; --leading-xs:16px; --leading-sm:19.5px; --leading-base:20px; --leading-lg:24px; --leading-xl:26px; --leading-2xl:30px;
  /* espacements, rayons, ombres */
  --spacing-1:4px; --spacing-2:8px; --spacing-3:12px; --spacing-4:16px; --spacing-5:20px; --spacing-6:24px; --spacing-8:32px; --spacing-10:40px; --spacing-12:48px; --spacing-16:64px;
  --radius-xs:2.6px; --radius-sm:5.2px; --radius-md:7.8px; --radius-lg:10.4px; --radius-xl:13px; --radius-full:9999px;
  --shadow-sm:0 2px 4px rgba(16,15,15,.05);
  --shadow-md:0 4px 12px rgba(16,15,15,.05);
  --shadow-lg:0 32px 64px rgba(16,15,15,.05), 0 -16px 32px rgba(16,15,15,.05);
  --sidebar-width:64px; --topbar-height:65px;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--color-background);color:var(--color-text);font:var(--font-weight-book) var(--text-sm)/var(--leading-sm) var(--font-sans);-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:40;background:var(--color-white)}
a{color:inherit}
button{font:inherit;color:inherit}
h1,h2,h3,h4{margin:0;text-wrap:balance}
p{margin:0}
.display{font-weight:var(--font-weight-bold);letter-spacing:0}
.label{font-size:var(--text-2xs);line-height:var(--leading-2xs);font-weight:var(--font-weight-medium);letter-spacing:.06em;text-transform:uppercase;color:var(--color-text-muted)}
.muted{color:var(--color-text-muted)}
code.inline{font:12px/1 var(--font-mono);background:var(--color-surface);padding:2px 6px;border-radius:4px}

/* ---------- shell ---------- */
.shell{display:flex;min-height:100%}
.sidebar{position:sticky;top:0;align-self:flex-start;height:100vh;height:100dvh;width:260px;flex-shrink:0;overflow-y:auto;background:var(--color-white);border-right:1px solid var(--color-border-light);display:flex;flex-direction:column;gap:24px;padding-block:16px 48px;padding-left:max(12px,env(safe-area-inset-left,0px));padding-right:12px}
.brand{display:flex;align-items:center;gap:12px;padding:4px 10px;text-decoration:none}
.brand svg{width:auto;height:38px;flex-shrink:0}
.brand span{display:flex;flex-direction:column;font-size:var(--text-sm);font-weight:var(--font-weight-semibold);line-height:16px;color:var(--color-text)}
.brand span small{font-weight:var(--font-weight-book);color:var(--color-text-muted);font-size:var(--text-xs)}
.nav-group{display:flex;flex-direction:column;gap:2px}
.group-title{display:flex;align-items:center;height:30px;padding:0 10px;margin-bottom:2px;font-size:var(--text-sm);font-weight:var(--font-weight-bold);color:var(--color-text);text-decoration:none;border-radius:var(--radius-sm)}
.group-title:hover{background:var(--color-surface)}
.nav-item{display:flex;align-items:center;justify-content:space-between;gap:8px;height:30px;padding:0 10px;border-radius:var(--radius-lg);font-size:var(--text-sm);line-height:var(--leading-sm);text-decoration:none;color:var(--color-text-muted)}
.nav-item:hover{background:var(--color-surface);color:var(--color-text)}
.nav-item.is-active{background:var(--color-primary-soft);color:var(--color-green-800);font-weight:var(--font-weight-semibold)}
.nav-item.is-soon{color:var(--color-text-faint)}
.nav-item .soon{flex-shrink:0}
.nav-item[hidden]{display:none}
.soon{display:inline-flex;align-items:center;height:18px;padding:0 7px;border-radius:var(--radius-sm);background:var(--color-surface);color:var(--color-text-muted);font-size:10px;line-height:12px;font-weight:var(--font-weight-medium);letter-spacing:.06em;text-transform:uppercase}
.nav-empty{padding:8px 10px;font-size:var(--text-sm);color:var(--color-text-muted)}

.content{flex:1;min-width:0;display:flex;flex-direction:column}
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;display:flex;align-items:center;gap:12px;height:var(--topbar-height);background:var(--color-white);border-bottom:1px solid var(--color-border-light);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.menu-btn{display:none;align-items:center;justify-content:center;width:36px;height:36px;border:1px solid var(--color-border);border-radius:var(--radius-lg);background:var(--color-white);cursor:pointer;flex-shrink:0}
.topbar .o-search{flex:1;max-width:420px;min-width:0}
.kbd{display:inline-flex;align-items:center;height:20px;padding:0 6px;border:1px solid var(--color-border);border-radius:4px;background:var(--color-white);font:11px/1 var(--font-mono);color:var(--color-text-muted);flex-shrink:0}
.topnav{margin-left:auto;display:flex;align-items:center;gap:4px}
.topnav a{display:inline-flex;align-items:center;gap:6px;height:32px;padding:0 12px;border-radius:var(--radius-lg);font-size:var(--text-sm);font-weight:var(--font-weight-medium);color:var(--color-text-muted);text-decoration:none;white-space:nowrap}
.topnav a:hover{background:var(--color-surface);color:var(--color-text)}
.topnav a.is-active{color:var(--color-green-800);background:var(--color-primary-soft)}
.scrim{display:none;position:fixed;inset:0;background:rgba(0,0,0,.48);z-index:25}

.page{width:100%;max-width:1060px;padding-block:36px 96px;padding-left:max(56px,env(safe-area-inset-left,0px));padding-right:max(56px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:36px}
.page-head{display:flex;flex-direction:column;gap:10px}
.page-head h1{font-size:var(--text-2xl);line-height:var(--leading-2xl);font-weight:var(--font-weight-bold)}
.page-head .lede{font-size:var(--text-base);line-height:var(--leading-lg);color:var(--color-text-muted);max-width:66ch}
.page-head .head-row{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.section{display:flex;flex-direction:column;gap:14px}
.section > h2{font-size:var(--text-lg);line-height:var(--leading-lg);font-weight:var(--font-weight-bold);padding-bottom:10px;border-bottom:1px solid var(--color-border-light)}
.section > p{max-width:66ch;font-size:var(--text-base);line-height:var(--leading-lg)}
.section .note{font-size:var(--text-sm);line-height:var(--leading-sm);color:var(--color-text-muted);max-width:66ch}
.seen{display:flex;flex-wrap:wrap;gap:6px 10px;font-size:var(--text-sm);color:var(--color-text-muted)}
.seen b{color:var(--color-text);font-weight:var(--font-weight-medium)}

/* demo card */
.demo{border:1px solid var(--color-border-light);border-radius:var(--radius-xl);background:var(--color-white);overflow:hidden;box-shadow:var(--shadow-sm)}
.demo-preview{padding:28px;display:flex;flex-wrap:wrap;align-items:center;gap:14px;min-width:0}
.demo-preview.is-block{display:block}
.demo-preview.is-stack{flex-direction:column;align-items:stretch}
.demo-preview.is-grey{background:var(--color-background)}
.demo-foot{border-top:1px solid var(--color-border-light);display:flex;flex-direction:column}
.demo-toggle{display:flex;align-items:center;gap:8px;width:100%;padding:11px 18px;border:0;background:transparent;cursor:pointer;text-align:left;font-size:var(--text-sm);font-weight:var(--font-weight-medium)}
.demo-toggle:hover{background:var(--color-background)}
.demo-toggle svg{transition:transform .15s;flex-shrink:0}
.demo-toggle.is-on svg{transform:rotate(90deg)}
.demo-toggle .demo-file{margin-left:auto}
.demo-panel{border-top:1px solid var(--color-border-light);background:var(--color-surface)}
.demo-panel + .demo-toggle{border-top:1px solid var(--color-border-light)}
.demo-toggle + .demo-toggle{border-top:1px solid var(--color-border-light)}
.demo-toggle--rules{background:var(--color-white)}
.demo-code{border-top:1px solid var(--color-border-light);background:var(--color-surface)}
.demo-tabs{display:flex;align-items:center;gap:4px;padding:8px 12px 0}
.demo-tabs button{height:26px;padding:0 10px;border:0;border-radius:var(--radius-sm);background:transparent;font-size:var(--text-2xs);font-weight:var(--font-weight-bold);letter-spacing:.06em;text-transform:uppercase;color:var(--color-text-muted);cursor:pointer}
.demo-tabs button.is-on{background:var(--color-white);color:var(--color-text)}
.demo-file{margin-left:auto;font:12px/1 var(--font-mono);color:var(--color-text-muted)}
.demo-code pre,.demo-panel pre{margin:0;padding:16px 18px 20px;overflow-x:auto;font:12.5px/1.55 var(--font-mono);color:var(--color-text);white-space:pre;tab-size:2}
.demo-panel pre{white-space:pre-wrap;overflow-wrap:anywhere;padding-top:40px}
.demo-code .codewrap,.demo-panel .codewrap{position:relative}
.copy-btn{position:absolute;right:12px;top:8px;height:26px;padding:0 10px;border:1px solid var(--color-border);border-radius:var(--radius-lg);background:var(--color-white);font-size:var(--text-xs);font-weight:var(--font-weight-medium);cursor:pointer}
.filetree{margin:0;padding:16px 20px;font:12.5px/1.7 var(--font-mono);background:var(--color-surface);border-radius:var(--radius-lg);overflow-x:auto}
.bundle-actions{display:flex;flex-wrap:wrap;gap:8px}

.pager{display:flex;justify-content:space-between;gap:16px;padding-top:20px;border-top:1px solid var(--color-border-light)}
.pager a{display:flex;flex-direction:column;gap:2px;text-decoration:none;max-width:48%}
.pager a.next{text-align:right;margin-left:auto}
.pager strong{font-size:var(--text-base);font-weight:var(--font-weight-medium);display:flex;align-items:center;gap:6px}
.pager a.next strong{justify-content:flex-end}

/* intro bento */
.bento{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
.bento a{display:flex;flex-direction:column;gap:10px;text-decoration:none;border:1px solid var(--color-border-light);border-radius:var(--radius-xl);background:var(--color-white);padding:14px;min-width:0;box-shadow:var(--shadow-sm)}
.bento a:hover{border-color:var(--color-border)}
.bento-preview{height:170px;border-radius:var(--radius-lg);background:var(--color-background);display:flex;align-items:center;justify-content:center;gap:10px;padding:18px;overflow:hidden}
.bento h3{font-size:var(--text-base);font-weight:var(--font-weight-bold)}
.bento p{font-size:var(--text-sm);line-height:var(--leading-sm);color:var(--color-text-muted)}
.bars{display:flex;gap:10px;align-items:flex-end}
.bars i{display:block;width:14px;height:84px;border-radius:var(--radius-full);border:1px solid var(--color-border-light)}

/* colours */
.swatches{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:14px}
.swatch{display:flex;flex-direction:column;gap:8px;min-width:0}
.swatch i{display:block;height:84px;border-radius:var(--radius-lg);border:1px solid var(--color-border-light)}
.swatch b{font-size:var(--text-sm);font-weight:var(--font-weight-medium)}
.swatch small{font-size:var(--text-2xs);letter-spacing:.06em;text-transform:uppercase;color:var(--color-text-muted)}
.tablewrap{overflow-x:auto;border:1px solid var(--color-border-light);border-radius:var(--radius-xl);background:var(--color-white)}
table.roles{border-collapse:collapse;width:100%;min-width:640px;font-size:var(--text-sm)}
table.roles th,table.roles td{text-align:left;padding:10px 14px;border-bottom:1px solid var(--color-border-light);vertical-align:middle}
table.roles th{font-size:var(--text-2xs);letter-spacing:.06em;text-transform:uppercase;color:var(--color-grey-700);font-weight:var(--font-weight-book);background:var(--color-surface)}
table.roles tr:last-child td{border-bottom:0}
table.roles .dot{display:inline-block;width:26px;height:26px;border-radius:var(--radius-full);border:1px solid var(--color-border-light);vertical-align:middle}
table.roles code{font:12px/1 var(--font-mono)}

/* typography / materials */
.type-scale{display:flex;flex-direction:column}
.type-row{display:grid;grid-template-columns:220px minmax(0,1fr);gap:28px;padding:18px 0;border-bottom:1px solid var(--color-border-light);align-items:start}
.type-row:last-child{border-bottom:0}
.type-row .meta{display:flex;flex-direction:column;gap:2px;padding-top:2px}
.type-row .meta b{font-size:var(--text-sm);font-weight:var(--font-weight-medium)}
.type-row .meta small{font-size:var(--text-2xs);letter-spacing:.06em;text-transform:uppercase;color:var(--color-text-muted)}
.type-row .spec{min-width:0;overflow-wrap:anywhere}
.preset-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:14px;width:100%}
.preset{display:flex;flex-direction:column;gap:8px;min-width:0}
.preset .box{height:110px;display:flex;align-items:flex-end;padding:12px;font-size:var(--text-xs);color:inherit}
.preset b{font:var(--font-weight-medium) var(--text-sm)/var(--leading-sm) var(--font-mono)}
.preset small{font-size:var(--text-xs);color:var(--color-text-muted);line-height:var(--leading-xs)}
.space-row{display:flex;align-items:flex-end;gap:14px;flex-wrap:wrap}
.space-row figure{margin:0;display:flex;flex-direction:column;gap:6px;min-width:56px}
.space-row i{display:block;background:var(--color-primary);border-radius:2px}
.space-row figcaption{font-size:var(--text-xs);color:var(--color-text-muted)}

/* screens & components index */
.comp-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:10px}
.comp-grid a{display:flex;align-items:center;justify-content:space-between;gap:8px;height:48px;padding:0 14px;border:1px solid var(--color-border-light);border-radius:var(--radius-lg);background:var(--color-white);text-decoration:none;font-size:var(--text-sm);font-weight:var(--font-weight-medium);box-shadow:var(--shadow-sm)}
.comp-grid a:hover{border-color:var(--color-border)}
.comp-grid a.is-soon{color:var(--color-text-muted);font-weight:var(--font-weight-book)}
.empty-page{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;min-height:240px;border:1px dashed var(--color-border);border-radius:var(--radius-xl);background:var(--color-white);text-align:center;padding:28px;color:var(--color-text-muted)}
.empty-page .display{font-size:var(--text-2xl);line-height:var(--leading-2xl);color:var(--color-text)}
.facts{display:grid;grid-template-columns:180px minmax(0,1fr);gap:8px 20px;font-size:var(--text-sm)}
.facts dt{color:var(--color-text-muted)}
.facts dd{margin:0;overflow-wrap:anywhere}
.changelog{display:flex;flex-direction:column}
.changelog > div{display:grid;grid-template-columns:150px minmax(0,1fr);gap:8px 20px;padding:18px 0;border-bottom:1px solid var(--color-border-light)}
.changelog > div:last-child{border-bottom:0}
.changelog time{font-size:var(--text-sm);color:var(--color-text-muted)}
.changelog ul{margin:0;padding-left:18px;font-size:var(--text-sm);line-height:var(--leading-sm);display:flex;flex-direction:column;gap:4px}
.changelog h3{font-size:var(--text-base);font-weight:var(--font-weight-bold);margin-bottom:6px}
.screen-frame{width:100%;border:1px solid var(--color-border-light);border-radius:var(--radius-xl);overflow:hidden;background:var(--color-background)}

@media (max-width:900px){
  .sidebar{position:fixed;left:0;top:0;z-index:30;transform:translateX(-100%);transition:transform .2s ease}
  body.nav-open .sidebar{transform:none}
  body.nav-open .scrim{display:block}
  .menu-btn{display:inline-flex}
  .page{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));gap:28px}
  .bento{grid-template-columns:minmax(0,1fr)}
  .type-row{grid-template-columns:minmax(0,1fr);gap:6px}
  .facts,.changelog > div{grid-template-columns:minmax(0,1fr)}
  .topnav a{padding:0 8px;font-size:var(--text-xs)}
  .topbar .o-search .kbd{display:none}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
:focus-visible{outline:2px solid var(--color-primary);outline-offset:2px}

/* ---- ISO additions ---- */
.demo-preview[data-shadow-host]{display:block}
.demo-preview.is-shadow{display:flex;align-items:center;justify-content:center}
.bento-preview.is-shadow{flex-wrap:wrap;overflow:hidden}
.scale{display:flex;flex-direction:column;gap:6px;margin-bottom:14px}
.scale > b{font-size:var(--text-sm);font-weight:var(--font-weight-semibold)}
.scale-row{display:flex;flex-wrap:wrap;gap:6px}
.sw{display:flex;flex-direction:column;gap:3px;width:72px}
.sw i{display:block;height:44px;border-radius:var(--radius-sm);border:1px solid var(--color-border-light)}
.sw span{font-size:var(--text-2xs);font-weight:var(--font-weight-medium)}
.sw small{font:10px/1 var(--font-mono);color:var(--color-text-muted)}
.sem{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:4px 16px}
.sem-row{display:flex;align-items:center;gap:8px;padding:5px 0;border-bottom:1px solid var(--color-border-light);font-size:var(--text-xs)}
.sem-row i{width:18px;height:18px;border-radius:var(--radius-full);border:1px solid var(--color-border-light);flex-shrink:0}
.sem-row code{font:11px/1 var(--font-mono);overflow-wrap:anywhere;flex:1;min-width:0}
.sem-row span{font:11px/1 var(--font-mono);color:var(--color-text-muted);white-space:nowrap}
.icon-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(64px,1fr));gap:8px}
.icon-cell{display:flex;flex-direction:column;align-items:center;gap:6px;padding:10px 4px;border:1px solid var(--color-border-light);border-radius:var(--radius-lg);background:var(--color-white)}
.icon-cell small{font:9px/1 var(--font-mono);color:var(--color-text-muted)}
.shape-row{display:flex;gap:14px;align-items:center}
.shape-row i{display:block;width:64px;height:48px}
.demo-code pre[hidden]{display:none}
.demo-tabs button{white-space:nowrap}
.demo-toggle .demo-file{font-size:11px}
.type-row .spec{line-height:1.3}
.space-row figcaption small{font:10px/1 var(--font-mono)}

.o-search{display:flex;align-items:center;gap:10px;height:33px;padding:0 12px;border:1px solid var(--color-border-light);border-radius:var(--radius-lg);background:var(--color-white);color:var(--color-text);cursor:text}
.o-search:focus-within{border-color:var(--color-border)}
.o-search input{flex:1;min-width:0;border:0;background:transparent;outline:none;font:var(--font-weight-book) var(--text-sm)/var(--leading-sm) var(--font-sans);color:var(--color-text)}
.o-search input::placeholder{color:var(--color-text-faint)}
.o-search svg{flex-shrink:0;color:var(--color-text-muted)}
/* ---------- Design System Hub ---------- */
.soon.is-ds{background:var(--color-primary-soft);color:var(--color-green-800)}
.ds-toggle{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:14px;font-size:var(--text-xs)}
.ds-toggle .aud-btn.is-on{background:var(--color-primary-soft);border-color:var(--color-green-100);color:var(--color-green-800)}
.ds-block{display:flex;flex-direction:column;gap:10px;margin-bottom:18px}
.ds-card{background:var(--color-white);border:1px solid var(--color-border-light);border-radius:var(--radius-xl);padding:14px 16px;display:flex;flex-direction:column;gap:10px}
.ds-card-head{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.ds-card-head b{font:600 13px/1 var(--font-mono)}
.ds-tag{display:inline-flex;align-items:center;height:20px;padding:0 8px;border-radius:var(--radius-full);background:var(--color-surface);color:var(--color-text-muted);font-size:11px;font-weight:var(--font-weight-medium);white-space:nowrap}
.ds-tag.is-ds{background:var(--color-primary-soft);color:var(--color-green-800)}
.ds-tag.is-hub{background:#EEF2FF;color:#3730A3}
.ds-row{display:grid;grid-template-columns:150px 1fr;gap:6px 14px;align-items:start;font-size:var(--text-sm)}
.ds-row>div{display:flex;flex-wrap:wrap;gap:4px;align-items:center}
.ds-row .muted{font-size:var(--text-xs);margin-left:4px}
.ds-chip{display:inline-flex;align-items:center;height:22px;padding:0 8px;border-radius:var(--radius-sm);background:var(--color-surface);font:500 12px/1 var(--font-mono);color:var(--color-text)}
.ds-chip.is-default{background:var(--color-grey-900);color:#fff}
.ds-none,.ds-prodnote{display:flex;align-items:flex-start;gap:12px;padding:14px 16px;border:1px dashed var(--color-border);border-radius:var(--radius-xl);background:var(--color-white);font-size:var(--text-sm);color:var(--color-text-muted)}
.ds-none p,.ds-prodnote p{margin:0}
.ds-prodnote{margin-top:16px}
.demo.is-ds .demo-preview{background:repeating-linear-gradient(45deg,transparent 0 12px,rgba(18,119,70,.025) 12px 24px),var(--color-white)}
.ds-conf{display:flex;flex-direction:column;gap:12px}
.ds-conf-score{display:flex;align-items:center;gap:14px;padding:12px 16px;border-radius:var(--radius-xl);background:var(--color-primary-soft);border:1px solid var(--color-green-100);font-size:var(--text-sm)}
.ds-conf-score b{font-size:26px;font-weight:var(--font-weight-bold);color:var(--color-green-800);line-height:1}
.ds-conf-score.is-mid{background:var(--color-warning-soft);border-color:#F5E9B8}.ds-conf-score.is-mid b{color:var(--color-warning-text)}
.ds-conf-score.is-low{background:#FFF0F0;border-color:#FFB0B0}.ds-conf-score.is-low b{color:#8C0000}
.tablewrap{overflow-x:auto;max-width:100%}
.ds-table{width:100%;border-collapse:collapse;font-size:var(--text-xs);background:var(--color-white);border:1px solid var(--color-border-light);border-radius:var(--radius-lg)}
.ds-table th{text-align:left;font-weight:var(--font-weight-semibold);color:var(--color-text-muted);padding:8px 10px;border-bottom:1px solid var(--color-border-light);white-space:nowrap}
.ds-table td{padding:8px 10px;border-bottom:1px solid var(--color-border-light);vertical-align:top}
.ds-table tr:last-child td{border-bottom:0}
.ds-table tr.is-muted td{color:var(--color-text-muted)}
.ds-table code{font:11px/16px var(--font-mono)}
.ds-table .ds-chip{height:18px;font-size:11px;margin:1px 2px 1px 0}
.ds-diffs{display:flex;flex-direction:column;gap:2px}
.ds-diffs i{font:11px/16px var(--font-mono);font-style:normal;padding:0 6px;border-radius:4px;white-space:nowrap;max-width:420px;overflow:hidden;text-overflow:ellipsis}
.ds-diffs i.add{background:#E9F7EF;color:#156035}.ds-diffs i.del{background:#FFE6E6;color:#8C0000}
.ds-sw{display:inline-block;width:12px;height:12px;border-radius:3px;border:1px solid rgba(0,0,0,.1);vertical-align:-2px;margin-right:6px}
.ds-stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px}
.ds-stats div{background:var(--color-white);border:1px solid var(--color-border-light);border-radius:var(--radius-xl);padding:14px 16px;display:flex;flex-direction:column;gap:4px}
.ds-stats b{font-size:24px;font-weight:var(--font-weight-bold);line-height:1}
.ds-stats span{font-size:var(--text-xs);color:var(--color-text-muted);line-height:14px}
.ds-hublist{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:8px}
.ds-hub{display:flex;flex-direction:column;gap:3px;padding:10px 12px;background:var(--color-white);border:1px solid var(--color-border-light);border-radius:var(--radius-lg);font-size:var(--text-xs)}
.ds-hub b{font:600 12px/1.3 var(--font-mono)}
.ds-hub span{color:var(--color-text-muted)}
.ds-hub.is-muted{opacity:.6}
.ds-hub a{color:var(--color-green-800);text-decoration:none;font-weight:var(--font-weight-medium)}

/* ---------- mode Play : audit UI ---------- */
.play-btn{display:inline-flex;align-items:center;gap:8px;height:32px;padding:0 14px 0 10px;border:0;border-radius:var(--radius-full);background:var(--color-primary);color:var(--color-primary-foreground);font-size:var(--text-sm);font-weight:var(--font-weight-semibold);cursor:pointer;flex-shrink:0;box-shadow:var(--shadow-sm)}
.play-btn:hover{background:var(--color-green-700)}
.play-btn svg{width:12px;height:12px}
body.is-audit{overflow:hidden}
#audit{position:fixed;inset:0;z-index:100;display:flex;flex-direction:column;background:var(--color-background);color:var(--color-text);padding-top:env(safe-area-inset-top,0px)}
.aud-top{display:flex;align-items:center;gap:20px;height:60px;flex-shrink:0;background:var(--color-white);border-bottom:1px solid var(--color-border-light);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.aud-brand{display:flex;align-items:center;gap:12px;min-width:0}
.aud-brand div{display:flex;flex-direction:column;line-height:16px}
.aud-brand strong{font-size:var(--text-base);font-weight:var(--font-weight-semibold)}
.aud-brand span{font-size:var(--text-xs);color:var(--color-text-muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.aud-playdot{display:inline-flex;align-items:center;justify-content:center;width:32px;height:32px;border-radius:var(--radius-full);background:var(--color-primary);color:#fff;flex-shrink:0}
.aud-global{display:flex;align-items:center;gap:12px;margin-left:8px}
.aud-global>div:last-child{display:flex;flex-direction:column;line-height:14px}
.aud-global small{font-size:var(--text-xs);color:var(--color-text-muted)}
.aud-ring{--c:var(--color-green-600);position:relative;width:40px;height:40px;border-radius:50%;background:conic-gradient(var(--c) calc(var(--p)*1%),var(--color-surface-strong) 0);display:grid;place-items:center;flex-shrink:0}
.aud-ring::before{content:"";position:absolute;inset:4px;border-radius:50%;background:var(--color-white)}
.aud-ring b{position:relative;font-size:13px;font-weight:var(--font-weight-bold)}
.aud-ring.is-mid{--c:#C29B00}.aud-ring.is-low{--c:var(--color-red-500)}
.aud-btn{display:inline-flex;align-items:center;gap:8px;height:32px;padding:0 12px;border:1px solid var(--color-border);border-radius:var(--radius-lg);background:var(--color-white);font-size:var(--text-sm);font-weight:var(--font-weight-medium);cursor:pointer;color:var(--color-text);white-space:nowrap}
.aud-btn:hover{background:var(--color-surface)}
.aud-btn:disabled{opacity:.4;cursor:default}
.aud-btn kbd{font:11px/1 var(--font-mono);padding:2px 5px;border:1px solid var(--color-border);border-radius:4px;color:var(--color-text-muted)}
.aud-quit{margin-left:auto}
#audMethod{margin-left:auto}
#audMethod+.aud-quit{margin-left:0}
.aud-body{flex:1;min-height:0;display:grid;grid-template-columns:300px 1fr;gap:0}
#audit.has-detail .aud-body{grid-template-columns:300px 360px 1fr}
.aud-list{display:flex;flex-direction:column;min-height:0;background:var(--color-white);border-right:1px solid var(--color-border-light)}
.aud-tools{display:flex;gap:8px;padding:12px;border-bottom:1px solid var(--color-border-light)}
.aud-tools input,.aud-tools select{height:32px;border:1px solid var(--color-border-light);border-radius:var(--radius-lg);background:var(--color-white);font:var(--font-weight-book) var(--text-sm)/1 var(--font-sans);color:var(--color-text);padding:0 10px;min-width:0}
.aud-tools input{flex:1}
.aud-tools input:focus,.aud-tools select:focus{outline:none;border-color:var(--color-border)}
.aud-items{flex:1;overflow-y:auto;padding:8px}
.aud-row{display:grid;grid-template-columns:1fr auto;grid-template-areas:"name count" "bar score";column-gap:10px;row-gap:6px;align-items:center;width:100%;padding:10px 10px;border:1px solid transparent;border-radius:var(--radius-lg);background:transparent;text-align:left;cursor:pointer;margin-bottom:2px}
.aud-row:hover{background:var(--color-background)}
.aud-row.is-on{background:var(--color-primary-soft);border-color:var(--color-green-100)}
.aud-row.is-absent{opacity:.55}
.aud-row.is-absent.is-on{opacity:1}
.aud-name{grid-area:name;font-weight:var(--font-weight-medium);font-size:var(--text-sm)}
.aud-count{grid-area:count;font:11px/1 var(--font-mono);color:var(--color-text-muted)}
.aud-bar{grid-area:bar;height:5px;border-radius:var(--radius-full);background:var(--color-surface);overflow:hidden}
.aud-bar i{display:block;height:100%;border-radius:inherit;background:var(--color-green-600)}
.aud-row.is-mid .aud-bar i{background:#C29B00}.aud-row.is-low .aud-bar i{background:var(--color-red-500)}
.aud-score{grid-area:score;font-size:13px;font-weight:var(--font-weight-bold);font-variant-numeric:tabular-nums;min-width:22px;text-align:right}
.aud-row.is-mid .aud-score{color:#806600}.aud-row.is-low .aud-score{color:#B50000}.aud-row.is-good .aud-score{color:var(--color-green-700)}
.aud-legend{display:flex;align-items:center;gap:6px;padding:10px 14px;border-top:1px solid var(--color-border-light);font-size:var(--text-xs);color:var(--color-text-muted)}
.aud-legend i{width:10px;height:10px;border-radius:3px;background:var(--color-green-600);margin-left:8px}
.aud-legend i:first-child{margin-left:0}
.aud-legend i.is-mid{background:#C29B00}.aud-legend i.is-low{background:var(--color-red-500)}
.aud-empty{padding:20px;color:var(--color-text-muted);text-align:center}
/* détail */
.aud-detail{min-height:0;overflow-y:auto;background:var(--color-white);border-right:1px solid var(--color-border-light);padding:16px 18px 24px;display:flex;flex-direction:column;gap:18px}
.aud-dhead{display:flex;align-items:flex-start;gap:12px}
.aud-dhead>div:first-child{flex:1;min-width:0;display:flex;flex-direction:column;gap:4px}
.aud-dhead h2{font-size:var(--text-xl);line-height:var(--leading-xl);font-weight:var(--font-weight-bold)}
.aud-dhead code{font:11px/16px var(--font-mono);color:var(--color-text-muted);white-space:pre-wrap;word-break:break-all}
.aud-big{display:flex;align-items:baseline;gap:2px;font-weight:var(--font-weight-bold);color:var(--color-green-700)}
.aud-big b{font-size:28px;line-height:1}
.aud-big span{font-size:var(--text-xs);color:var(--color-text-muted)}
.aud-big.is-mid{color:#806600}.aud-big.is-low{color:#B50000}
.aud-dclose{width:32px;padding:0;justify-content:center}
.aud-metrics{display:flex;flex-direction:column;gap:12px;padding:14px;border:1px solid var(--color-border-light);border-radius:var(--radius-xl);background:var(--color-background)}
.aud-metric{display:grid;grid-template-columns:76px 1fr auto;grid-template-areas:"l bar v" "l small small";column-gap:10px;row-gap:4px;align-items:center}
.aud-metric>span:first-child{grid-area:l;font-size:var(--text-sm);font-weight:var(--font-weight-medium)}
.aud-metric>b{grid-area:v;font-size:var(--text-sm);font-variant-numeric:tabular-nums}
.aud-metric>em{grid-area:bar;font-style:normal;font-size:var(--text-xs);color:var(--color-text-muted)}
.aud-metric>small{grid-area:small;font-size:var(--text-xs);color:var(--color-text-muted);line-height:14px}
.aud-mbar{height:6px;border-radius:var(--radius-full);background:var(--color-surface-strong);overflow:hidden}
.aud-metric>.aud-mbar{grid-area:bar}
.aud-mbar i{display:block;height:100%;background:var(--color-green-600);border-radius:inherit}
.aud-mbar.is-mid i{background:#C29B00}.aud-mbar.is-low i{background:var(--color-red-500)}
.aud-states{display:flex;flex-wrap:wrap;gap:4px}
.aud-states i{font-style:normal;font-size:10px;line-height:16px;padding:0 6px;border-radius:4px;background:var(--color-surface-strong);color:var(--color-text-muted)}
.aud-states i.ok{background:var(--color-success-soft);color:var(--color-success-text)}
.aud-states i.ko{text-decoration:line-through}
.aud-pen{display:flex;flex-direction:column;gap:4px;font-size:var(--text-xs);color:#B50000}
.aud-section{display:flex;flex-direction:column;gap:8px}
.aud-hard{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:4px}
.aud-hard li{display:flex;justify-content:space-between;gap:10px;align-items:center;font-size:var(--text-xs)}
.aud-hard code{font:11px/16px var(--font-mono);background:var(--color-surface);padding:2px 6px;border-radius:4px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.aud-hard span{color:var(--color-text-muted);flex-shrink:0;font-variant-numeric:tabular-nums}
.aud-inst{display:flex;align-items:center;gap:10px;font-size:var(--text-sm)}
.aud-instnav{display:inline-flex;align-items:center;gap:6px;margin-left:auto;font:12px/1 var(--font-mono);color:var(--color-text-muted)}
.aud-instnav .aud-btn{width:28px;height:28px;padding:0;justify-content:center}
.aud-chips{display:flex;flex-wrap:wrap;gap:6px}
.aud-chip{display:inline-flex;align-items:center;gap:6px;height:26px;padding:0 10px;border:1px solid var(--color-border-light);border-radius:var(--radius-full);background:var(--color-white);font-size:var(--text-xs);cursor:pointer;color:var(--color-text)}
.aud-chip b{font-weight:var(--font-weight-semibold);color:var(--color-text-muted)}
.aud-chip:hover{border-color:var(--color-border)}
.aud-chip.is-on{background:var(--color-primary-soft);border-color:var(--color-green-100);color:var(--color-green-800)}
.aud-notes{margin:0;padding-left:16px;font-size:var(--text-xs);color:var(--color-text-muted);display:flex;flex-direction:column;gap:4px}
.aud-open{display:inline-flex;align-items:center;gap:6px;font-size:var(--text-sm);font-weight:var(--font-weight-medium);color:var(--color-green-800);text-decoration:none;margin-top:auto}
.aud-open:hover{text-decoration:underline}
/* navigateur */
.aud-browser{min-width:0;min-height:0;display:flex;flex-direction:column;padding:14px;gap:10px}
.aud-chrome{display:flex;align-items:center;gap:10px;height:44px;padding:0 10px;background:var(--color-white);border:1px solid var(--color-border-light);border-radius:var(--radius-xl);box-shadow:var(--shadow-sm)}
.aud-navbtns{display:flex;gap:2px}
.aud-navbtns button{width:30px;height:30px;border:0;border-radius:var(--radius-md);background:transparent;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;color:var(--color-text-muted)}
.aud-navbtns button:hover{background:var(--color-surface);color:var(--color-text)}
.aud-navbtns button:disabled{opacity:.35;cursor:default;background:transparent}
.aud-url{flex:1;min-width:0;display:flex;align-items:center;gap:8px;height:30px;padding:0 10px;border-radius:var(--radius-full);background:var(--color-background);font:12px/1 var(--font-mono)}
.aud-dot{width:8px;height:8px;border-radius:50%;background:var(--color-green-600);flex-shrink:0}
.aud-hostname{color:var(--color-text-muted);flex-shrink:0}
.aud-url select{flex:1;min-width:0;border:0;background:transparent;font:12px/1 var(--font-mono);color:var(--color-text);cursor:pointer;outline:none;text-overflow:ellipsis}
.aud-zoom{height:28px;border:1px solid var(--color-border-light);border-radius:var(--radius-md);background:var(--color-white);font:500 12px/1 var(--font-sans);color:var(--color-text-muted);padding:0 6px}
.aud-toggle{display:inline-flex;align-items:center;gap:6px;font-size:var(--text-xs);font-weight:var(--font-weight-medium);color:var(--color-text-muted);cursor:pointer;user-select:none;white-space:nowrap}
.aud-toggle input{accent-color:var(--color-primary)}
.aud-frame{position:relative;flex:1;min-height:0;border:1px solid var(--color-border-light);border-radius:var(--radius-xl);background:var(--color-grey-50);box-shadow:var(--shadow-md);overflow:hidden}
.aud-host{position:absolute;inset:0}
.aud-overlay{position:absolute;inset:0;pointer-events:none}
.aud-overlay svg{position:absolute;inset:0;width:100%;height:100%}
.aud-box{position:absolute;box-sizing:border-box;border:2px solid var(--color-green-600);border-radius:4px;box-shadow:0 0 0 2px rgba(255,255,255,.6)}
.aud-box.is-focus{border-color:#FFCD05;box-shadow:0 0 0 2px rgba(255,255,255,.8),0 0 0 6px rgba(255,205,5,.35)}
.aud-box span,.aud-hover span{position:absolute;left:-2px;top:-24px;height:20px;display:inline-flex;align-items:center;padding:0 8px;border-radius:4px;background:var(--color-green-600);color:#fff;font:11px/1 var(--font-mono);white-space:nowrap;max-width:60vw;overflow:hidden;text-overflow:ellipsis}
.aud-box.is-focus span{background:#232930}
.aud-hover{position:absolute;box-sizing:border-box;border:1.5px dashed var(--color-green-600);border-radius:4px;background:rgba(18,119,70,.06)}
.aud-hover span{background:#232930;top:auto;bottom:-24px}
.aud-toast{position:absolute;left:50%;bottom:16px;transform:translateX(-50%);padding:8px 14px;border-radius:var(--radius-full);background:#232930;color:#fff;font-size:var(--text-xs);box-shadow:var(--shadow-md);pointer-events:none}
.aud-screennote{position:absolute;right:12px;bottom:12px;padding:5px 10px;border-radius:var(--radius-full);background:rgba(35,41,48,.78);color:#fff;font-size:10px;letter-spacing:.02em;pointer-events:none;max-width:70%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
/* méthode */
.aud-method{position:absolute;inset:0;z-index:5;background:rgba(35,41,48,.45);display:flex;align-items:center;justify-content:center;padding:24px}
.aud-method-card{width:min(640px,100%);max-height:100%;overflow-y:auto;background:var(--color-white);border-radius:var(--radius-xl);box-shadow:var(--shadow-lg);padding:24px;display:flex;flex-direction:column;gap:14px;font-size:var(--text-sm);line-height:var(--leading-sm)}
.aud-method-head{display:flex;align-items:center;justify-content:space-between;gap:12px}
.aud-method-head h2{font-size:var(--text-xl);font-weight:var(--font-weight-bold)}
.aud-method-head .aud-btn{width:32px;padding:0;justify-content:center}
.aud-method dl{margin:0;display:grid;grid-template-columns:130px 1fr;gap:10px 16px}
.aud-method dt{font-weight:var(--font-weight-semibold)}
.aud-method dd{margin:0;color:var(--color-text-muted)}
.aud-method code{font:12px/1 var(--font-mono);background:var(--color-surface);padding:1px 5px;border-radius:4px;color:var(--color-text)}
@media (max-width:1100px){
  #audit.has-detail .aud-body{grid-template-columns:300px 1fr}
  #audit.has-detail .aud-detail{position:absolute;left:300px;top:60px;bottom:0;width:360px;z-index:3;box-shadow:var(--shadow-lg)}
}
@media (max-width:800px){
  .play-btn{width:32px;padding:0;justify-content:center;font-size:0;gap:0}
  .topbar .o-search{min-width:0;flex:1 1 60px}
  .topnav{flex-shrink:1;min-width:0;overflow-x:auto}
  .aud-body,#audit.has-detail .aud-body{grid-template-columns:1fr;grid-template-rows:38vh 1fr}
  #audit.has-detail .aud-detail{left:0;right:0;width:auto;top:auto;height:60vh}
  .aud-global small,.aud-brand span{display:none}
  .aud-method dl{grid-template-columns:1fr}
  .aud-hostname{display:none}
}
/* détail en langage courant */
.aud-verdict{display:flex;flex-direction:column;gap:4px;padding:12px 14px;border-radius:var(--radius-xl);background:var(--color-primary-soft);border:1px solid var(--color-green-100);font-size:var(--text-sm);line-height:var(--leading-sm)}
.aud-verdict strong{font-weight:var(--font-weight-semibold);color:var(--color-green-800)}
.aud-verdict span{color:var(--color-text)}
.aud-verdict.is-mid{background:var(--color-warning-soft);border-color:#F5E9B8}.aud-verdict.is-mid strong{color:var(--color-warning-text)}
.aud-verdict.is-low{background:#FFF0F0;border-color:#FFB0B0}.aud-verdict.is-low strong{color:#8C0000}
.aud-crit{display:flex;flex-direction:column;gap:14px;padding:14px;border:1px solid var(--color-border-light);border-radius:var(--radius-xl);background:var(--color-background)}
.aud-c{display:flex;flex-direction:column;gap:6px}
.aud-c-top{display:grid;grid-template-columns:1fr 90px auto;align-items:center;gap:10px}
.aud-c-top>span{font-size:var(--text-sm);font-weight:var(--font-weight-semibold)}

<script>
const PAGES = [{"id":"introduction","group":"Fondations","title":"Orica, pour les designers","lede":"Les composants d’Orica tels qu’ils sont à l’écran, et seulement ceux-là. Rien n’est dessiné à la main : chaque aperçu est l’interface réelle, rendue avec ses propres styles. Les noms entre parenthèses sont ceux du Design System Hub, pour parler le même langage que les développeurs.","body":"<div class=\"bento\">\n      <a href=\"#couleurs\"><div class=\"bento-preview\"><div class=\"bars\"><i style=\"background:#232930\"></i><i style=\"background:#999ea4\"></i><i style=\"background:#e5e9ef\"></i><i style=\"background:#127746\"></i><i style=\"background:#b6d5c6\"></i><i style=\"background:#053021\"></i><i style=\"background:#DEAF58\"></i><i style=\"background:#DEAF58\"></i><i style=\"background:#85333A\"></i></div></div><h3>Couleurs</h3><p>La palette Orica, par usage : texte, fonds, accent, statuts, qualités.</p></a>\n      <a href=\"#composants\"><div class=\"bento-preview is-shadow\" data-shadow-host></div><template data-shadow><button type=\"button\" class=\"chakra-button css-umgg81\"><span class=\"chakra-button__icon css-1wh2kri\"><svg viewBox=\"0 0 512 512\" class=\"chakra-icon chakra-icon css-y7v38x\" focusable=\"false\" aria-hidden=\"true\"><path fill=\"currentColor\" d=\"M256 32a224 224 0 1 1 0 448 224 224 0 1 1 0-448zm0 480A256 256 0 1 0 256 0a256 256 0 1 0 0 512zM240 352c0 8.8 7.2 16 16 16s16-7.2 16-16l0-80 80 0c8.8 0 16-7.2 16-16s-7.2-16-16-16l-80 0 0-80c0-8.8-7.2-16-16-16s-16 7.2-16 16l0 80-80 0c-8.8 0-16 7.2-16 16s7.2 16 16 16l80 0 0 80z\"></path></svg></span>Nouvelle référence</button> <div role=\"tablist\" aria-orientation=\"horizontal\" class=\"chakra-tabs__tablist css-1q9h0zz\"><button type=\"button\" role=\"tab\" tabindex=\"0\" aria-selected=\"true\" class=\"chakra-tabs__tab css-1e8kyhm\" data-index=\"0\">Plan détaillé</button><button type=\"button\" role=\"tab\" tabindex=\"-1\" aria-selected=\"false\" class=\"chakra-tabs__tab css-1e8kyhm\" data-index=\"1\">Echantillons</button><button type=\"button\" role=\"tab\" tabindex=\"-1\" aria-selected=\"false\" class=\"chakra-tabs__tab css-1e8kyhm\" data-index=\"2\">Objectifs</button></div></template><h3>Composants</h3><p>21 composants réellement utilisés, avec leurs variantes et leurs états.</p></a>\n      <a href=\"#ecran-references\"><div class=\"bento-preview is-shadow\" data-shadow-host style=\"align-items:flex-start\"></div><template data-shadow><div class=\"css-0\"><div class=\"chakra-portal\"><header class=\"css-1gknp9i\"><h2 class=\"chakra-heading css-13e5vvr\">Références</h2><div class=\"css-19dx92s\"><div role=\"radiogroup\" class=\"css-1laeaix\"><div aria-hidden=\"true\" draggable=\"false\" class=\"css-19sgq5y\" style=\"width: 55px; transform: translateX(3px) scaleX(1) translateZ(0px); user-select: none; touch-action: pan-y;\"></div><label class=\"css-jr8qiq\"><input aria-label=\"Café\" type=\"radio\" name=\"radio-group\" value=\"CAFE\" checked=\"\" style=\"border: 0px; clip: rect(0px, 0px, 0px, 0px); height: 1px; width: 1px; margin: -1px; padding: 0px; overflow: hidden; white-space: nowrap; position: absolute;\"><span data-checked=\"\" aria-hidden=\"true\" class=\"css-1287ah6\"><span class=\"chakra-text css-0\">Café</span></span></label><label class=\"css-12f4m5z\"><input aria-label=\"Cacao\" type=\"radio\" name=\"radio-group\" value=\"CACAO\" style=\"border: 0px; clip: rect(0px, 0px, 0px, 0px); height: 1px; width: 1px; margin: -1px; padding: 0px; overflow: hidden; white-space: nowrap; position: absolute;\"><span aria-hidden=\"true\" class=\"css-1287ah6\"><span class=\"chakra-text css-0\">Cacao</span></span></label></div></div><div class=\"css-d8cwxj\"><button type=\"button\" class=\"chakra-button css-umgg81\"><span class=\"chakra-button__icon css-1wh2kri\"><svg viewBox=\"0 0 512 512\" class=\"chakra-icon chakra-icon css-y7v38x\" focusable=\"false\" aria-hidden=\"true\"><path fill=\"currentColor\" d=\"M256 32a224 224 0 1 1 0 448 224 224 0 1 1 0-448zm0 480A256 256 0 1 0 256 0a256 256 0 1 0 0 512zM240 352c0 8.8 7.2 16 16 16s16-7.2 16-16l0-80 80 0c8.8 0 16-7.2 16-16s-7.2-16-16-16l-80 0 0-80c0-8.8-7.2-16-16-16s-16 7.2-16 16l0 80-80 0c-8.8 0-16 7.2-16 16s7.2 16 16 16l80 0 0 80z\"></path></svg></span>Nouvelle référence</button></div></header></div></div></template><h3>Écrans</h3><p>Les 8 écrans d’Orica, pour voir les composants en situation.</p></a>\n      <a href=\"#typographie\"><div class=\"bento-preview\"><div style=\"display:flex;flex-direction:column;gap:6px;align-items:center;font-family:CentraNo2,system-ui,sans-serif\"><span style=\"font-size:25px;font-weight:700;line-height:1.2\">CentraNo2</span><span style=\"font-size:13px;color:#777a7f\">13 px de base · 4 graisses</span></div></div><h3>Typographie</h3><p>Une seule famille, une échelle courte.</p></a>\n    </div>\n    <section class=\"section\"><h2>Comment lire cette doc</h2><p>Chaque composant montre ses variantes (les cas réellement rencontrés sur les écrans), ses états (repos, survol, clic, focus, désactivé) et quelques règles d’usage observées. Les aperçus sont vivants : on peut les survoler. Pour le code, le CSS, l’audit et le chat de propositions, voir la <a href=\"../\">version complète</a>.</p></section>","soon":false,"nopager":false},{"id":"couleurs","group":"Fondations","title":"Couleurs","lede":"La palette d’Orica, par usage. Les valeurs sont celles de l’interface.","body":"<section class=\"section\"><h2>Accent et marque</h2><p class=\"note\">Le bouton primaire est un dégradé du 600 au 400, qui passe au 700 → 500 au survol.</p><div class=\"sw-row\"><div class=\"swc\"><i style=\"background:#127746\"></i><b>primary</b><small>Accent Orica : boutons primaires, onglet actif, liens</small><code>#127746</code></div><div class=\"swc\"><i style=\"background:#0d5432\"></i><b>primary-700</b><small>Accent foncé : fin du dégradé des boutons</small><code>#0d5432</code></div><div class=\"swc\"><i style=\"background:#b6d5c6\"></i><b>primary-100</b><small>Accent clair : fonds discrets</small><code>#b6d5c6</code></div><div class=\"swc\"><i style=\"background:#e7f1ed\"></i><b>primary-50</b><small>Accent très clair : survols, fonds de sélection</small><code>#e7f1ed</code></div><div class=\"swc\"><i style=\"background:#053021\"></i><b>green-900</b><small>Vert forêt Belco</small><code>#053021</code></div><div class=\"swc\"><i style=\"background:#DEAF58\"></i><b>sand</b><small>Sable Belco</small><code>#DEAF58</code></div></div></section>\n    <section class=\"section\"><h2>Texte et fonds</h2><div class=\"sw-row\"><div class=\"swc\"><i style=\"background:#232930\"></i><b>dark</b><small>Texte courant et titres</small><code>#232930</code></div><div class=\"swc\"><i style=\"background:#4f5459\"></i><b>dark-400</b><small>Texte secondaire</small><code>#4f5459</code></div><div class=\"swc\"><i style=\"background:#999ea4\"></i><b>gray-700</b><small>Texte atténué, placeholders</small><code>#999ea4</code></div><div class=\"swc\"><i style=\"background:#f8f9fa\"></i><b>gray-100</b><small>Fond de page</small><code>#f8f9fa</code></div><div class=\"swc\"><i style=\"background:#FFFFFF\"></i><b>white</b><small>Fond des cartes, champs, tableaux</small><code>#FFFFFF</code></div><div class=\"swc\"><i style=\"background:#edf0f4\"></i><b>gray-200</b><small>Filets, séparateurs, boutons secondaires</small><code>#edf0f4</code></div><div class=\"swc\"><i style=\"background:#e5e9ef\"></i><b>gray-300</b><small>Filets plus marqués (onglets)</small><code>#e5e9ef</code></div><div class=\"swc\"><i style=\"background:#d8dee7\"></i><b>gray</b><small>Bordures de champs au survol</small><code>#d8dee7</code></div></div></section>\n    <section class=\"section\"><h2>Statuts</h2><p class=\"note\">Chaque statut a une version claire (100) pour les fonds de badge et une version pleine (500) pour le texte ou la pastille.</p><div class=\"sw-row\"><div class=\"swc\"><i style=\"background:#27AE60\"></i><b>success</b><small>Succès</small><code>#27AE60</code></div><div class=\"swc\"> a changé, par version.","body":"<section class=\"section\"><h2>Historique</h2><div class=\"changelog\"><div><time datetime=\"2026-11-24\">24 novembre 2026</time><div><h3>v2.0 · Design System Hub comme source</h3><p class=\"label\" style=\"margin:0 0 6px\">Ajouté</p><ul><li>Fondations : page Design System Hub (thème, tokens surchargés par Orica, composants du thème et composants Hub). Composants : Alert, Progress, Slider, HubIcon, ScrollBox, TangoTuto, Notes, rendus depuis la source du DS ; Modal, Tooltip, Switch, Skeleton, Date picker, Import de fichier, Number input, Kanban passent de Soon à « DS » (définis dans le DS, non relevés sur les écrans). Sur chaque composant relevé : section « Dans le Design System Hub » (variantes, tailles, schémas, stories rendues) et « Conformité au Design System Hub » (classes servies comparées à la source). Mode Play : critère « Conforme au DS Hub ». Chat : outil lire_ds. Règle rules/design-system-hub.md.</li></ul><p class=\"label\" style=\"margin:12px 0 6px\">Modifié</p><ul><li>Le paquet design-system-hub (Chakra UI 2.5.5) est la référence ; le relevé prod du 5 novembre reste la mesure de ce qui est servi. Les scores du mode Play intègrent la conformité au DS (40 %).</li></ul></div></div><div><time datetime=\"2026-11-05\">5 novembre 2026</time><div><h3>v1.0 · Relevé ISO</h3><p class=\"label\" style=\"margin:0 0 6px\">Ajouté</p><ul><li>Fondations : Icônes. Composants : Segmented control, Menu déroulant, Heading &amp; divider, Lien. Écrans : Panneau Filtres.</li></ul><p class=\"label\" style=\"margin:12px 0 6px\">Modifié</p><ul><li>Toute la documentation est reconstruite à partir du code servi : 801 variables du thème Chakra, 500 classes Emotion avec leurs états, 95 icônes SVG, 97 échantillons HTML sur 9 écrans. Les versions réécrites (v0.1) sont retirées.</li></ul><p class=\"label\" style=\"margin:12px 0 6px\">Supprimé</p><ul><li>Chips de choix (c’étaient des chakra-button), Progression (c’est une barre empilée dans la carte KPI), Toggle vue (non relevé dans Orica).</li></ul></div></div><div><time datetime=\"2026-11-04\">4 novembre 2026</time><div><h3>v0.1 · Relevé visuel</h3><p class=\"label\" style=\"margin:0 0 6px\">Ajouté</p><ul><li>Première version, composants réécrits à partir des styles calculés et de captures. Remplacée par la v1.0.</li></ul></div></div></div></section>","soon":false,"nopager":true}];

const COMPONENTS_CSS = document.getElementById('prodComponents').textContent;
const DS_CSS = '';
const SHARED_CSS = document.getElementById('prodShared').textContent;
const AGENTS = '';
const AUDIT = [];
const RULES_MD = {};
const DS_TOKENS_CSS = '';
const DS_COMPONENTS = null;
const CHAT_ENABLED = false;
const APP_SCREENS = [];
/* ---------- rendu ISO : chaque aperçu est un shadow root avec les règles de la prod ---------- */
let sharedSheet=null, compSheet=null, previewSheet=null, dsSheet=null;
function sheets(){
  if(sharedSheet) return [sharedSheet, compSheet, dsSheet, previewSheet];
  try{ sharedSheet=new CSSStyleSheet(); sharedSheet.replaceSync(SHARED_CSS.replace(/:root, :host/g,':host')); compSheet=new CSSStyleSheet(); compSheet.replaceSync(COMPONENTS_CSS); dsSheet=new CSSStyleSheet(); dsSheet.replaceSync(typeof DS_CSS==='string'?DS_CSS:''); previewSheet=new CSSStyleSheet(); }catch(e){ sharedSheet=null; }
  return [sharedSheet, compSheet, dsSheet, previewSheet];
}
// tokens du DS Hub (source) à la place de la surcharge Orica, dans tous les aperçus
let dsTokensOn=false;
function toggleDsTokens(force){ dsTokensOn=typeof force==='boolean'?force:!dsTokensOn; setPreviewTokens(dsTokensOn?(typeof DS_TOKENS_CSS==='string'?DS_TOKENS_CSS:''):''); document.body.classList.toggle('ds-tokens-on',dsTokensOn); document.querySelectorAll('[data-ds-tokens]').forEach(b=>{ b.textContent=dsTokensOn?'Revenir aux tokens Orica':'Voir avec les tokens du DS Hub'; b.classList.toggle('is-on',dsTokensOn); }); }
document.addEventListener('click',e=>{ const b=e.target.closest('[data-ds-tokens]'); if(b) toggleDsTokens(); });
// aperçu d'une proposition de tokens : une feuille partagée par tous les shadow roots, vide par défaut
function setPreviewTokens(css){ const [,,,pv]=sheets(); if(pv){ try{ pv.replaceSync(css||''); }catch(e){} } }
function mountShadows(root){
  root.querySelectorAll('[data-shadow-host]').forEach(host=>{
    if(host.shadowRoot) return;
    const tpl=host.nextElementSibling && host.nextElementSibling.matches('template[data-shadow]') ? host.nextElementSibling : null;
    if(!tpl) return;
    const sh=host.attachShadow({mode:'open'});
    const [a,b,ds,pv]=sheets();
    if(a&&sh.adoptedStyleSheets!==undefined){ sh.adoptedStyleSheets=[a,b,ds,pv]; }
    else { const st=document.createElement('style'); st.textContent=SHARED_CSS.replace(/:root, :host/g,':host')+'\n'+COMPONENTS_CSS+'\n'+(typeof DS_CSS==='string'?DS_CSS:''); sh.appendChild(st); }
    const wrap=document.createElement('div'); wrap.className='chakra-ui-light'; wrap.style.cssText='font-family:var(--chakra-fonts-body);color:var(--chakra-colors-dark-500);font-size:var(--chakra-fontSizes-md);line-height:1.5;-webkit-font-smoothing:antialiased;text-rendering:optimizelegibility;font-feature-settings:"kern";position:relative;transform:translateZ(0);contain:layout paint;overflow:hidden;display:flex;flex-wrap:wrap;gap:14px;align-items:center;width:100%';
    if(host.style.minHeight) wrap.style.minHeight=host.style.minHeight;
    if(host.classList.contains('is-block')) wrap.style.cssText+=';display:block';
    wrap.innerHTML=tpl.innerHTML;
    // les liens et boutons ne doivent pas naviguer
    wrap.querySelectorAll('a[href]').forEach(x=>{x.setAttribute('data-href',x.getAttribute('href'));x.removeAttribute('href');});
    wrap.querySelectorAll('form').forEach(f=>f.addEventListener('submit',e=>e.preventDefault()));
    sh.appendChild(wrap);
  });
}
/* ---------- shell ---------- */
const $=s=>document.querySelector(s);
const navEl=$('#nav'), pageEl=$('#page'), q=$('#q');
const FLAT=NAV.flatMap(g=>g.items.map(i=>({...i,group:g.group})));
const EXTRA=[{id:'changelog',label:'Changelog',top:'changelog'},{id:'mcp',label:'MCP',top:'mcp'}];
const chevL='<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 6l-6 6 6 6"/></svg>';
const chevR='<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg>';
function buildNav(){
  navEl.innerHTML=NAV.map(g=>`<div class="nav-group"><a class="group-title" href="#${g.home}">${g.group}</a>${g.items.map(i=>`<a class="nav-item ${i.soon?'is-soon':''}" href="#${i.id}" data-id="${i.id}"><span>${i.label}</span>${i.soon?'<span class="soon">Soon</span>':i.ds?'<span class="soon is-ds">DS</span>':''}</a>`).join('')}</div>`).join('')+'<div class="nav-empty" id="navEmpty" hidden>Aucun résultat.</div>';
}
function currentId(){const h=(location.hash||'').replace(/^#/,'');return PAGES.some(p=>p.id===h)?h:'introduction';}
function render(){
  if((location.hash||'').replace(/^#/,'')==='audit'){ if(window.__audit) window.__audit.open(); return; }
  if(window.__audit){ window.__audit.close(); window.__audit.setLast(location.hash||'#introduction'); }
  const id=currentId(); const p=PAGES.find(x=>x.id===id);
  const idx=FLAT.findIndex(i=>i.id===id); const prev=p.nopager?null:FLAT[idx-1], next=p.nopager?null:FLAT[idx+1];
  const top=(EXTRA.find(e=>e.id===id)||{}).top||'ds';
  document.querySelectorAll('.topnav a').forEach(a=>a.classList.toggle('is-active',a.dataset.top===top));
  pageEl.innerHTML=`<header class="page-head"><span class="label">${p.group}</span><div class="head-row"><h1>${p.title}</h1>${p.soon?'<span class="soon">Soon</span>':''}</div>${p.lede?`<p class="lede">${p.lede}</p>`:''}</header>${p.body||''}${p.nopager?'':`<nav class="pager" aria-label="Pages voisines">${prev?`<a class="prev" href="#${prev.id}"><span class="label">Précédent</span><strong>${chevL} ${prev.label}</strong></a>`:'<span></span>'}${next?`<a class="next" href="#${next.id}"><span class="label">Suivant</span><strong>${next.label} ${chevR}</strong></a>`:''}</nav>`}`;
  const grid=$('#compGrid'); if(grid) grid.innerHTML=COMP.map(c=>`<a href="#${c.id}" class="${c.soon?'is-soon':''}">${c.title}${c.soon?'<span class="soon">Soon</span>':c.ds?'<span class="soon is-ds">DS</span>':chevR}</a>`).join('');
  document.querySelectorAll('.nav-item').forEach(a=>a.classList.toggle('is-active',a.dataset.id===id));
  mountShadows(pageEl);
  document.body.classList.remove('nav-open'); window.scrollTo({top:0});
  const active=document.querySelector('.nav-item.is-active'); if(active) active.scrollIntoView({block:'nearest'});
}
pageEl.addEventListener('click',e=>{
  const t=e.target.closest('.demo-toggle');
  if(t){const panel=t.nextElementSibling;if(panel&&panel.classList.contains('demo-panel')){panel.hidden=!panel.hidden;t.classList.toggle('is-on',!panel.hidden);if(t.dataset.panel==='code')t.querySelector('span').textContent=panel.hidden?'Afficher le code':'Masquer le code';}return;}
  const tab=e.target.closest('.demo-tabs button');
  if(tab){const panel=tab.closest('.demo-code');panel.querySelectorAll('.demo-tabs button').forEach(b=>b.classList.toggle('is-on',b===tab));const l=tab.dataset.lang;panel.querySelectorAll('pre').forEach(pre=>pre.hidden=!pre.hasAttribute('data-'+l));const file=panel.querySelector('.demo-tabs .demo-file');if(file)file.textContent=l==='css'?'components.css':l==='tokens'?'tokens.css':'samples/…html';return;}
  const cp=e.target.closest('.copy'); if(cp){const pre=[...cp.parentElement.querySelectorAll('pre')].find(p=>!p.hidden)||cp.parentElement.querySelector('pre');copyText(cp,pre.textContent,pre);return;}
  const b=e.target.closest('#copyAgents,#copyTokens,#copyCss'); if(b){copyText(b,b.id==='copyAgents'?AGENTS:b.id==='copyTokens'?TOKENS_CSS:COMPONENTS_CSS,$('#agentsCode'));return;}
});
function selectText(el){if(!el)return;const r=document.createRange();r.selectNodeContents(el);const s=getSelection();s.removeAllRanges();s.addRange(r);}
function copyText(btn,txt,fb){const label=btn.textContent;const done=()=>{btn.textContent='Copié';setTimeout(()=>btn.textContent=label,1500);};if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(txt).then(done).catch(()=>selectText(fb));else selectText(fb);}
$('#menuBtn').addEventListener('click',()=>document.body.classList.toggle('nav-open'));
$('#scrim').addEventListener('click',()=>document.body.classList.remove('nav-open'));
navEl.addEventListener('click',e=>{if(e.target.closest('.nav-item'))document.body.classList.remove('nav-open');});
q.addEventListener('input',()=>{const v=q.value.trim().toLowerCase();let n=0;document.querySelectorAll('.nav-item').forEach(a=>{const p=PAGES.find(x=>x.id===a.dataset.id);const hay=(a.textContent+' '+(p?p.body:'')).toLowerCase();const ok=!v||hay.includes(v);a.hidden=!ok;if(ok)n++;});document.querySelectorAll('.nav-group').forEach(g=>{g.hidden=![...g.querySelectorAll('.nav-item')].some(a=>!a.hidden);});$('#navEmpty').hidden=n>0;if(v&&window.innerWidth<=900)document.body.classList.add('nav-open');});
document.addEventListener('keydown',e=>{if((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==='k'){e.preventDefault();q.focus();q.select();}if(e.key==='Escape'){document.body.classList.remove('nav-open');if(document.activeElement===q){q.value='';q.dispatchEvent(new Event('input'));q.blur();}}});
buildNav(); window.addEventListener('hashchange',render); render();
