<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Belco Design System</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@900&family=Outfit:wght@400;500;700&display=swap">
<style>
/* Layout: Geist-style documentation shell — fixed left nav in three groups, sticky top bar with search,
   one reading column with preview cards and "Afficher le code". Single light theme: belco.fr has no dark mode. */
:root{
  /* palette relevée sur belco.fr */
  --color-white:#FFFFFF;
  --color-sand-50:#FBF9F5;
  --color-sand-100:#F2F0EB;
  --color-stone-200:#E8E8E8;
  --color-cream-50:#FFFFEC;
  --color-forest-600:#5B766B;
  --color-forest-900:#053021;
  --color-moss-700:#4C5439;
  --color-sage-500:#798A72;
  --color-flame-500:#F85A2F;
  --color-flame-600:#DE4A22;
  /* rôles sémantiques */
  --color-background:var(--color-sand-50);
  --color-surface:var(--color-sand-100);
  --color-surface-inverse:var(--color-forest-900);
  --color-text:var(--color-forest-900);
  --color-text-muted:var(--color-forest-600);
  --color-text-inverse:var(--color-cream-50);
  --color-border:var(--color-stone-200);
  --color-primary:var(--color-flame-500);
  --color-primary-hover:var(--color-flame-600);
  --color-primary-foreground:var(--color-sand-50);
  --color-secondary:var(--color-forest-900);
  --color-secondary-foreground:var(--color-cream-50);
  --color-accent-moss:var(--color-moss-700);
  --color-accent-sage:var(--color-sage-500);
  /* typographie */
  --font-display:"PP Formula Condensed","PP Formula","Barlow Condensed",Impact,sans-serif;
  --font-sans:"Centra No2","CentraNo2","Outfit",system-ui,sans-serif;
  --font-mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  --font-weight-book:400;
  --font-weight-medium:500;
  --font-weight-bold:700;
  --font-weight-black:900;
  --text-xs:12px; --text-sm:14px; --text-base:16px; --text-lg:18px; --text-xl:24px; --text-2xl:32px; --text-3xl:42px; --text-4xl:56px; --text-5xl:80px;
  --leading-xs:16px; --leading-sm:20px; --leading-base:24px; --leading-lg:28px; --leading-xl:30px; --leading-2xl:32px; --leading-3xl:42px; --leading-4xl:56px; --leading-5xl:76px;
  --tracking-tight:-0.01em; --tracking-normal:0em; --tracking-wide:0.06em;
  /* espacements, rayons */
  --spacing-1:4px; --spacing-2:8px; --spacing-3:12px; --spacing-4:16px; --spacing-5:20px; --spacing-6:24px; --spacing-8:32px; --spacing-10:40px; --spacing-12:48px; --spacing-16:64px; --spacing-20:80px; --spacing-24:96px;
  --radius-sm:6px; --radius-md:12px; --radius-lg:20px; --radius-full:9999px;
  --opacity-disabled:40%; --opacity-muted:60%;
  --breakpoint-sm:640px; --breakpoint-md:768px; --breakpoint-lg:1024px; --breakpoint-xl:1440px;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--color-background);color:var(--color-text);font:var(--font-weight-book) var(--text-base)/var(--leading-base) var(--font-sans);-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:40;background:var(--color-white)}
a{color:inherit}
button{font:inherit;color:inherit}
h1,h2,h3,h4{margin:0;text-wrap:balance}
p{margin:0}
.display{font-family:var(--font-display);font-weight:var(--font-weight-black);text-transform:uppercase;letter-spacing:0}
.label{font-size:var(--text-xs);line-height:var(--leading-xs);font-weight:var(--font-weight-medium);letter-spacing:var(--tracking-wide);text-transform:uppercase;color:var(--color-text-muted)}
.muted{color:var(--color-text-muted)}
code.inline{font:12px/1 var(--font-mono);background:var(--color-surface);padding:2px 6px;border-radius:4px}

/* ---------- shell ---------- */
.shell{display:flex;min-height:100%}
.sidebar{position:sticky;top:0;align-self:flex-start;height:100vh;height:100dvh;width:260px;flex-shrink:0;overflow-y:auto;background:var(--color-white);border-right:1px solid var(--color-border);display:flex;flex-direction:column;gap:28px;padding-block:20px 48px;padding-left:max(12px,env(safe-area-inset-left,0px));padding-right:12px}
.brand{display:flex;align-items:center;gap:12px;padding:4px 12px;text-decoration:none}
.brand svg{width:auto;height:44px;flex-shrink:0}
.brand span{font-size:var(--text-sm);font-weight:var(--font-weight-medium);line-height:var(--leading-sm);color:var(--color-text)}
.nav-group{display:flex;flex-direction:column;gap:2px}
.group-title{display:flex;align-items:center;height:32px;padding:0 12px;margin-bottom:4px;font-size:var(--text-sm);font-weight:var(--font-weight-bold);color:var(--color-text);text-decoration:none;border-radius:var(--radius-sm)}
.group-title:hover{background:var(--color-surface)}
.nav-item{display:flex;align-items:center;justify-content:space-between;gap:8px;height:30px;padding:0 12px;border-radius:var(--radius-full);font-size:var(--text-sm);line-height:var(--leading-sm);text-decoration:none;color:var(--color-text-muted)}
.nav-item:hover{background:var(--color-surface);color:var(--color-text)}
.nav-item.is-active{background:var(--color-secondary);color:var(--color-secondary-foreground);font-weight:var(--font-weight-medium)}
.nav-item.is-soon{color:var(--color-text-muted)}
.nav-item.is-active.is-soon{color:var(--color-secondary-foreground)}
.nav-item .soon{flex-shrink:0}
.nav-item[hidden]{display:none}
.soon{display:inline-flex;align-items:center;height:18px;padding:0 8px;border-radius:var(--radius-full);background:var(--color-surface);color:var(--color-text-muted);font-size:10px;line-height:12px;font-weight:var(--font-weight-medium);letter-spacing:var(--tracking-wide);text-transform:uppercase}
.nav-item.is-active .soon{background:color-mix(in srgb,var(--color-secondary-foreground) 18%,transparent);color:var(--color-secondary-foreground)}
.nav-empty{padding:8px 12px;font-size:var(--text-sm);color:var(--color-text-muted)}

.content{flex:1;min-width:0;display:flex;flex-direction:column}
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;display:flex;align-items:center;gap:12px;height:64px;background:var(--color-white);border-bottom:1px solid var(--color-border);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.menu-btn{display:none;align-items:center;justify-content:center;width:40px;height:40px;border:1px solid var(--color-border);border-radius:var(--radius-full);background:var(--color-white);cursor:pointer;flex-shrink:0}
.topbar .b-search{flex:1;max-width:420px;height:40px;min-width:0}
.topbar .b-search input{min-width:0}
.kbd{display:inline-flex;align-items:center;height:20px;padding:0 6px;border:1px solid var(--color-border);border-radius:4px;background:var(--color-white);font:11px/1 var(--font-mono);color:var(--color-text-muted);flex-shrink:0}
.topnav{margin-left:auto;display:flex;align-items:center;gap:4px}
.topnav a{display:inline-flex;align-items:center;gap:6px;height:32px;padding:0 12px;border-radius:var(--radius-full);font-size:var(--text-sm);font-weight:var(--font-weight-medium);color:var(--color-text-muted);text-decoration:none;white-space:nowrap}
.topnav a:hover{background:var(--color-surface);color:var(--color-text)}
.topnav a.is-active{color:var(--color-text);background:var(--color-surface)}
.logo-slot svg{height:120px;width:auto}
.bento-preview svg{height:110px;width:auto}
.changelog{display:flex;flex-direction:column}
.changelog > div{display:grid;grid-template-columns:160px minmax(0,1fr);gap:8px 24px;padding:20px 0;border-bottom:1px solid var(--color-border)}
.changelog > div:last-child{border-bottom:0}
.changelog time{font-size:var(--text-sm);color:var(--color-text-muted)}
.changelog ul{margin:0;padding-left:18px;font-size:var(--text-sm);line-height:var(--leading-sm);display:flex;flex-direction:column;gap:4px}
.changelog h3{font-size:var(--text-base);font-weight:var(--font-weight-bold);margin-bottom:8px}
.preset-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:16px;width:100%}
.preset{display:flex;flex-direction:column;gap:10px;min-width:0}
.preset .box{height:120px;display:flex;align-items:flex-end;padding:12px;font-size:var(--text-xs);color:inherit}
.preset b{font:var(--font-weight-medium) var(--text-sm)/var(--leading-sm) var(--font-mono)}
.preset small{font-size:var(--text-xs);color:var(--color-text-muted);line-height:var(--leading-xs)}
.scrim{display:none;position:fixed;inset:0;background:rgba(5,48,33,.35);z-index:25}

.page{width:100%;max-width:1060px;padding-block:40px 96px;padding-left:max(56px,env(safe-area-inset-left,0px));padding-right:max(56px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:40px}
.page-head{display:flex;flex-direction:column;gap:12px}
.page-head h1{font-size:var(--text-4xl);line-height:var(--leading-4xl)}
.page-head .lede{font-size:var(--text-lg);line-height:var(--leading-lg);color:var(--color-text-muted);max-width:66ch}
.page-head .head-row{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.section{display:flex;flex-direction:column;gap:16px}
.section > h2{font-size:var(--text-xl);line-height:var(--leading-xl);padding-bottom:12px;border-bottom:1px solid var(--color-border)}
.section > p{max-width:66ch;color:var(--color-text)}
.section .note{font-size:var(--text-sm);line-height:var(--leading-sm);color:var(--color-text-muted);max-width:66ch}
.seen{display:flex;flex-wrap:wrap;gap:6px 10px;font-size:var(--text-sm);color:var(--color-text-muted)}
.seen a{color:var(--color-text)}

/* demo card */
.demo{border:1px solid var(--color-border);border-radius:var(--radius-lg);background:var(--color-white);overflow:hidden}
.demo-preview{padding:32px;display:flex;flex-wrap:wrap;align-items:center;gap:16px;min-width:0}
.demo-preview.is-block{display:block}
.demo-preview.is-stack{flex-direction:column;align-items:stretch}
.demo-preview.is-sand{background:var(--color-background)}
.demo-preview.is-forest{background:var(--color-surface-inverse)}
.demo-foot{border-top:1px solid var(--color-border);display:flex;flex-direction:column}
.demo-toggle{display:flex;align-items:center;gap:8px;width:100%;padding:12px 20px;border:0;background:transparent;cursor:pointer;text-align:left;font-size:var(--text-sm);font-weight:var(--font-weight-medium)}
.demo-toggle:hover{background:var(--color-background)}
.demo-toggle svg{transition:transform .15s;flex-shrink:0}
.demo-toggle.is-on svg{transform:rotate(90deg)}
.demo-toggle .demo-file{margin-left:auto}
.demo-panel{border-top:1px solid var(--color-border);background:var(--color-surface)}
.demo-panel + .demo-toggle{border-top:1px solid var(--color-border)}
.demo-toggle + .demo-toggle{border-top:1px solid var(--color-border)}
.demo-toggle--rules{background:var(--color-white)}
.demo-toggle--rules .tag{display:inline-flex;align-items:center;height:20px;padding:0 8px;border-radius:var(--radius-full);background:var(--color-secondary);color:var(--color-secondary-foreground);font-size:10px;font-weight:var(--font-weight-bold);letter-spacing:var(--tracking-wide);text-transform:uppercase}
.demo-code{border-top:1px solid var(--color-border);background:var(--color-surface)}
.demo-tabs{display:flex;align-items:center;gap:4px;padding:8px 12px 0}
.demo-file{margin-left:auto;font:12px/1 var(--font-mono);color:var(--color-text-muted)}
.filetree{margin:0;padding:16px 20px;font:13px/1.7 var(--font-mono);background:var(--color-surface);border-radius:var(--radius-md);overflow-x:auto}
.filetree .muted{color:var(--color-text-muted)}
.bundle-actions{display:flex;flex-wrap:wrap;gap:8px}
.demo-tabs button{height:28px;padding:0 12px;border:0;border-radius:var(--radius-full);background:transparent;font-size:var(--text-xs);font-weight:var(--font-weight-bold);letter-spacing:var(--tracking-wide);text-transform:uppercase;color:var(--color-text-muted);cursor:pointer}
.demo-tabs button.is-on{background:var(--color-white);color:var(--color-text)}
.demo-code pre,.demo-panel pre{margin:0;padding:16px 20px 20px;overflow-x:auto;font:13px/1.55 var(--font-mono);color:var(--color-text);white-space:pre;tab-size:2}
.demo-panel pre{white-space:pre-wrap;overflow-wrap:anywhere;padding-top:40px}
.demo-code .copy{position:absolute;right:12px;top:8px}
.demo-code .codewrap{position:relative}
.copy-btn{height:28px;padding:0 12px;border:1px solid var(--color-border);border-radius:var(--radius-full);background:var(--color-white);font-size:var(--text-xs);font-weight:var(--font-weight-medium);cursor:pointer}

.pager{display:flex;justify-content:space-between;gap:16px;padding-top:24px;border-top:1px solid var(--color-border)}
.pager a{display:flex;flex-direction:column;gap:2px;text-decoration:none;max-width:48%}
.pager a.next{text-align:right;margin-left:auto}
.pager .label{color:var(--color-text-muted)}
.pager strong{font-size:var(--text-base);font-weight:var(--font-weight-medium);display:flex;align-items:center;gap:6px}
.pager a.next strong{justify-content:flex-end}

/* bento (introduction) */
.bento{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:20px}
.bento a{display:flex;flex-direction:column;gap:12px;text-decoration:none;border:1px solid var(--color-border);border-radius:var(--radius-lg);background:var(--color-white);padding:16px;min-width:0}
.bento a:hover{border-color:var(--color-text)}
.bento-preview{height:180px;border-radius:var(--radius-md);background:var(--color-background);display:flex;align-items:center;justify-content:center;gap:12px;padding:20px;overflow:hidden}
.bento h3{font-size:var(--text-base);font-weight:var(--font-weight-bold)}
.bento p{font-size:var(--text-sm);line-height:var(--leading-sm);color:var(--color-text-muted)}
.bars{display:flex;gap:10px;align-items:flex-end}
.bars i{display:block;width:14px;height:88px;border-radius:var(--radius-full);border:1px solid var(--color-border)}
.type-tiles{display:grid;grid-template-columns:1fr 1fr;gap:8px;width:100%;max-width:320px}
.type-tiles span{display:flex;align-items:center;justify-content:center;height:60px;border:1px solid var(--color-border);border-radius:var(--radius-md);background:var(--color-white);font-size:20px}
.shape-row{display:flex;gap:14px;align-items:center}
.shape-row i{display:block;width:64px;height:48px;background:var(--color-accent-moss)}
.wordmark{font-family:var(--font-display);font-weight:var(--font-weight-black);font-size:64px;line-height:64px;text-transform:uppercase}

/* colours page */
.swatches{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:16px}
.swatch{display:flex;flex-direction:column;gap:10px;min-width:0}
.swatch i{display:block;height:96px;border-radius:var(--radius-md);border:1px solid var(--color-border)}
.swatch b{font-size:var(--text-sm);font-weight:var(--font-weight-medium)}
.swatch small{font-size:var(--text-xs);letter-spacing:var(--tracking-wide);text-transform:uppercase;color:var(--color-text-muted)}
.tablewrap{overflow-x:auto;border:1px solid var(--color-border);border-radius:var(--radius-lg);background:var(--color-white)}
table.roles{border-collapse:collapse;width:100%;min-width:640px;font-size:var(--text-sm)}
table.roles th,table.roles td{text-align:left;padding:12px 16px;border-bottom:1px solid var(--color-border);vertical-align:middle}
table.roles th{font-size:var(--text-xs);letter-spacing:var(--tracking-wide);text-transform:uppercase;color:var(--color-text-muted);font-weight:var(--font-weight-medium)}
table.roles tr:last-child td{border-bottom:0}
table.roles .dot{display:inline-block;width:28px;height:28px;border-radius:var(--radius-full);border:1px solid var(--color-border);vertical-align:middle}
table.roles code{font:12px/1 var(--font-mono)}

/* typography page */
.type-scale{display:flex;flex-direction:column}
.type-row{display:grid;grid-template-columns:220px minmax(0,1fr);gap:32px;padding:24px 0;border-bottom:1px solid var(--color-border);align-items:start}
.type-row:last-child{border-bottom:0}
.type-row .meta{display:flex;flex-direction:column;gap:2px;padding-top:4px}
.type-row .meta b{font-size:var(--text-sm);font-weight:var(--font-weight-medium)}
.type-row .meta small{font-size:var(--text-xs);letter-spacing:var(--tracking-wide);text-transform:uppercase;color:var(--color-text-muted)}
.type-row .spec{min-width:0;overflow-wrap:anywhere}
.font-panel{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:20px}
.font-card{border:1px solid var(--color-border);border-radius:var(--radius-lg);background:var(--color-white);padding:24px;display:flex;flex-direction:column;gap:16px;min-width:0}
.font-card .big{font-size:64px;line-height:64px;overflow-wrap:anywhere}
.font-card dl{display:grid;grid-template-columns:auto 1fr;gap:6px 16px;margin:0;font-size:var(--text-sm)}
.font-card dt{color:var(--color-text-muted)}
.font-card dd{margin:0}
.radius-row{display:flex;flex-wrap:wrap;gap:24px}
.radius-row figure{margin:0;display:flex;flex-direction:column;gap:8px;width:140px}
.radius-row i{display:block;height:96px;background:var(--color-surface);border:1px solid var(--color-border)}
.radius-row figcaption{font-size:var(--text-sm)}
.radius-row figcaption small{display:block;font-size:var(--text-xs);letter-spacing:var(--tracking-wide);text-transform:uppercase;color:var(--color-text-muted)}
.space-row{display:flex;align-items:flex-end;gap:16px;flex-wrap:wrap}
.space-row figure{margin:0;display:flex;flex-direction:column;gap:8px;min-width:64px}
.space-row i{display:block;background:var(--color-accent-moss);border-radius:2px}
.space-row figcaption{font-size:var(--text-xs);color:var(--color-text-muted)}

/* brand page */
.logo-slot{display:flex;align-items:center;justify-content:center;gap:12px;height:200px;border:1px dashed var(--color-border);border-radius:var(--radius-lg);background:var(--color-white);color:var(--color-text-muted);font-size:var(--text-sm)}
.brand-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:20px}
.brand-grid a{display:flex;flex-direction:column;gap:10px;text-decoration:none;border:1px solid var(--color-border);border-radius:var(--radius-lg);background:var(--color-white);padding:16px}
.brand-grid a:hover{border-color:var(--color-text)}
.brand-grid .slot{height:120px;border-radius:var(--radius-md);background:var(--color-background);display:flex;align-items:center;justify-content:center;color:var(--color-text-muted);font-size:var(--text-sm)}
.brand-grid h3{font-size:var(--text-base);font-weight:var(--font-weight-bold)}
.facts{display:grid;grid-template-columns:200px minmax(0,1fr);gap:10px 24px;font-size:var(--text-sm)}
.facts dt{color:var(--color-text-muted)}
.facts dd{margin:0;overflow-wrap:anywhere}

/* components index */
.comp-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px}
.comp-grid a{display:flex;align-items:center;justify-content:space-between;gap:8px;height:52px;padding:0 16px;border:1px solid var(--color-border);border-radius:var(--radius-md);background:var(--color-white);text-decoration:none;font-size:var(--text-sm);font-weight:var(--font-weight-medium)}
.comp-grid a:hover{border-color:var(--color-text)}
.comp-grid a.is-soon{color:var(--color-text-muted);font-weight:var(--font-weight-book)}
.empty-page{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;min-height:280px;border:1px dashed var(--color-border);border-radius:var(--radius-lg);background:var(--color-white);text-align:center;padding:32px;color:var(--color-text-muted)}
.empty-page .display{font-size:var(--text-3xl);line-height:var(--leading-3xl);color:var(--color-text)}

/* responsive */
@media (max-width:900px){
  .sidebar{position:fixed;left:0;top:0;z-index:30;transform:translateX(-100%);transition:transform .2s ease}
  body.nav-open .sidebar{transform:none}
  body.nav-open .scrim{display:block}
  .menu-btn{display:inline-flex}
  .page{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));gap:32px}
  .page-head h1{font-size:var(--text-3xl);line-height:var(--leading-3xl)}
  .bento,.font-panel{grid-template-columns:minmax(0,1fr)}
  .type-row{grid-template-columns:minmax(0,1fr);gap:8px}
  .facts{grid-template-columns:minmax(0,1fr)}
  .topnav a{padding:0 8px;font-size:var(--text-xs)}
  .topbar .b-search .kbd{display:none}
  .changelog > div{grid-template-columns:minmax(0,1fr)}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
:focus-visible{outline:2px solid var(--color-primary);outline-offset:2px}
</style>
</head>
<body>

<div class="shell">
  <nav class="sidebar" id="sidebar" aria-label="Navigation de la documentation">
    <a class="brand" href="#introduction" id="brand"><span>Design System</span></a>
    <div id="nav"></div>
  </nav>
  <div class="scrim" id="scrim"></div>
  <div class="content">
    <header class="topbar">

const esc = s => s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
function dedent(s){
  const lines = s.replace(/^\n/,'').replace(/\s+$/,'').split('\n');
  const ind = Math.min(...lines.filter(l=>l.trim()).map(l=>l.match(/^\s*/)[0].length));
  return lines.map(l=>l.slice(ind)).join('\n');
}
const chev = '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg>';

function rulesFor(key){
  const rk = RULE_FILE[key] || key;
  return {file:`rules/${rk}.md`, text: AI_RULES[rk] || `# ${rk}\nStatut : Soon. Pas encore relevé sur belco.fr, aucune règle à donner à une IA.`};
}
function rulesRow(key){
  const r = rulesFor(key);
  return `<button class="demo-toggle demo-toggle--rules" type="button" data-panel="rules">${chev}<span>IA Rules</span><span class="demo-file">${r.file}</span></button>
    <div class="demo-panel demo-rules" hidden><div class="codewrap"><button class="copy-btn copy" type="button">Copier</button><pre><code>${esc(r.text)}</code></pre></div></div>`;
}
function demo(key, html, opts={}){
  const src = dedent(html);
  const cls = ['demo-preview', opts.block?'is-block':'', opts.stack?'is-stack':'', opts.sand?'is-sand':'', opts.forest?'is-forest':''].join(' ');
  return `<div class="demo" data-key="${key}">
    <div class="${cls}">${src}</div>
    <div class="demo-foot">
      <button class="demo-toggle" type="button" data-panel="code">${chev}<span>Afficher le code</span></button>

        <div class="codewrap"><button class="copy-btn copy" type="button">Copier</button><pre><code>${esc(src)}</code></pre></div>
      </div>
      ${rulesRow(key)}
    </div>
  </div>`;
}
function section(title, body, note){
  return `<section class="section"><h2 class="display">${title}</h2>${note?`<p class="note">${note}</p>`:''}${body}</section>`;
}
function seen(list){ return `<div class="seen"><span>Relevé sur :</span>${list.map(([t,u])=>`<a href="${u}" target="_blank" rel="noopener">${t}</a>`).join('<span>·</span>')}</div>`; }

## Sommaire
${RULE_ORDER.map(k=>`- rules/${k}.md`).join('\n')}

---

/* ---------- render ---------- */
const $ = s => document.querySelector(s);
const navEl = $('#nav'), pageEl = $('#page'), q = $('#q');

(function injectCss(){
  const st = document.createElement('style');
  st.textContent = Object.values(COMPONENT_CSS).join('\n');
  document.head.appendChild(st);
})();

const GROUP_HOME = {'Fondations':'introduction','Marques & labels':'marque-belco','Composants':'composants'};
const EXTRA = [{id:'changelog',label:'Changelog',group:'Suivi',top:'changelog'},{id:'mcp',label:'MCP',group:'Outils',top:'mcp'}];

function buildNav(){
  navEl.innerHTML = NAV.map(g => `<div class="nav-group"><a class="group-title" href="#${GROUP_HOME[g.group]}">${g.group}</a>${g.items.map(i => `<a class="nav-item ${i.soon?'is-soon':''}" href="#${i.id}" data-id="${i.id}"><span>${i.label}</span>${i.soon?'<span class="soon">Soon</span>':''}</a>`).join('')}</div>`).join('') + '<div class="nav-empty" id="navEmpty" hidden>Aucun résultat.</div>';
  $('#brand').insertAdjacentHTML('afterbegin', BELCO_LOGO);
}

function currentId(){
  const h = (location.hash||'').replace(/^#/,'');
  return (FLAT.some(i=>i.id===h) || EXTRA.some(i=>i.id===h)) ? h : 'introduction';
}

function render(){
  const id = currentId();
  const item = FLAT.find(i=>i.id===id) || EXTRA.find(i=>i.id===id);
  const data = PAGES[id] ? PAGES[id]() : soonPage(item);
  const idx = FLAT.findIndex(i=>i.id===id);
  const prev = data.nopager ? null : FLAT[idx-1], next = data.nopager ? null : FLAT[idx+1];
  const top = item.top || 'ds';
  document.querySelectorAll('.topnav a').forEach(a => a.classList.toggle('is-active', a.dataset.top===top));
  pageEl.innerHTML = `
    <header class="page-head">
      <span class="label">${data.eyebrow||item.group}</span>
      <div class="head-row"><h1 class="display">${data.title}</h1>${data.soon?'<span class="soon">Soon</span>':''}</div>
      ${data.lede?`<p class="lede">${data.lede}</p>`:''}
    </header>
    ${data.body||''}
    ${data.nopager ? '' : `<nav class="pager" aria-label="Pages voisines">
      ${prev?`<a class="prev" href="#${prev.id}"><span class="label">Précédent</span><strong>${chev.replace('M9 6l6 6-6 6','M15 6l-6 6 6 6')} ${prev.label}</strong></a>`:'<span></span>'}
      ${next?`<a class="next" href="#${next.id}"><span class="label">Suivant</span><strong>${next.label} ${chev}</strong></a>`:''}
    </nav>`}`;
  document.querySelectorAll('.nav-item').forEach(a => a.classList.toggle('is-active', a.dataset.id===id));
  const tc = $('#tokensCode');
  if (tc) tc.textContent = tokensText();
  document.body.classList.remove('nav-open');
  window.scrollTo({top:0});
  const active = document.querySelector('.nav-item.is-active');
  if (active) active.scrollIntoView({block:'nearest'});
}

function tokensText(){
  try{
    for (const sh of document.styleSheets){
      let rules; try{ rules = sh.cssRules; }catch(e){ continue; }
      for (const r of rules){
        if (r.selectorText === ':root'){
          const body = r.style.cssText.split(';').map(s=>s.trim()).filter(Boolean).map(s=>'  '+s+';').join('\n');
          return ':root {\n'+body+'\n}';
        }
      }
    }
  }catch(e){}
  return ':root { /* non lisible */ }';
}

/* interactions */
pageEl.addEventListener('click', e => {
  const t = e.target.closest('.demo-toggle');
  if (t){
    const panel = t.nextElementSibling;
    if (panel && panel.classList.contains('demo-panel')){
      panel.hidden = !panel.hidden; t.classList.toggle('is-on', !panel.hidden);
      if (t.dataset.panel==='code') t.querySelector('span').textContent = panel.hidden ? 'Afficher le code' : 'Masquer le code';
    }
    return;
  }
  const tab = e.target.closest('.demo-tabs button');
  if (tab){
    const d = tab.closest('.demo'); const key = d.dataset.key;
    const panel = tab.closest('.demo-code');
    panel.querySelectorAll('.demo-tabs button').forEach(b=>b.classList.toggle('is-on', b===tab));
    const code = panel.querySelector('pre code');
    const file = panel.querySelector('.demo-file');
    if (tab.dataset.lang==='css'){ code.textContent = key==='tokens' ? tokensText() : (COMPONENT_CSS[key] || '/* Pas de CSS propre : ce composant n’utilise que les variables de la page Couleurs. */'); if (file) file.textContent = key==='tokens' ? 'tokens.css' : (COMPONENT_CSS[key] ? 'components.css' : ''); }
    else { const pv = d.querySelector('.demo-preview'); code.textContent = pv ? dedent(pv.innerHTML) : ''; if (file) file.textContent = ''; }
    return;
  }
  const cp = e.target.closest('.copy');
  if (cp){
    copyText(cp, cp.parentElement.querySelector('code').textContent, cp.parentElement.querySelector('code'));
    return;
  }
  const bundle = e.target.closest('#copyAgents,#copyTokens,#copyCss');
  if (bundle){
    const txt = bundle.id==='copyAgents' ? agentsMd() : bundle.id==='copyTokens' ? tokensText() : Object.values(COMPONENT_CSS).join('\n\n');
    copyText(bundle, txt, document.querySelector('.demo[data-key="agents"] code'));
    return;
  }
  const bt = e.target.closest('.b-tab');
  if (bt){ bt.parentElement.querySelectorAll('.b-tab').forEach(b=>b.setAttribute('aria-selected', b===bt?'true':'false')); return; }
  const chip = e.target.closest('button.b-chip');
  if (chip){ chip.classList.toggle('is-on'); return; }
  const tg = e.target.closest('.b-toggle');
  if (tg){ tg.classList.toggle('is-on'); return; }
  const f = e.target.closest('.b-filter');
  if (f){ f.classList.toggle('is-open'); return; }
});
function selectText(el){ if(!el) return; const r=document.createRange(); r.selectNodeContents(el); const s=getSelection(); s.removeAllRanges(); s.addRange(r); }
function copyText(btn, txt, fallbackEl){
  const label = btn.textContent;
  const done = () => { btn.textContent='Copié'; setTimeout(()=>btn.textContent=label,1500); };
  if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(txt).then(done).catch(()=>selectText(fallbackEl));
  else selectText(fallbackEl);
}

$('#menuBtn').addEventListener('click', ()=>document.body.classList.toggle('nav-open'));
$('#scrim').addEventListener('click', ()=>document.body.classList.remove('nav-open'));
navEl.addEventListener('click', e => { if (e.target.closest('.nav-item')) document.body.classList.remove('nav-open'); });

q.addEventListener('input', () => {
  const v = q.value.trim().toLowerCase();
  let n = 0;
  document.querySelectorAll('.nav-item').forEach(a => { const ok = !v || a.textContent.toLowerCase().includes(v); a.hidden = !ok; if (ok) n++; });
  document.querySelectorAll('.nav-group').forEach(g => { g.hidden = ![...g.querySelectorAll('.nav-item')].some(a=>!a.hidden); });
  $('#navEmpty').hidden = n>0;
  if (v && window.innerWidth<=900) document.body.classList.add('nav-open');
});
document.addEventListener('keydown', e => {
  if ((e.metaKey||e.ctrlKey) && e.key.toLowerCase()==='k'){ e.preventDefault(); q.focus(); q.select(); }
  if (e.key==='Escape'){ document.body.classList.remove('nav-open'); if (document.activeElement===q){ q.value=''; q.dispatchEvent(new Event('input')); q.blur(); } }
});
buildNav();
window.addEventListener('hashchange', render);
render();
</script>
